<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mantenimiento - Iniciar Sesión</title>
  <link rel="icon" type="image/png" href="assets/colegio/logo2.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles/login.css" />
  <link rel="stylesheet" href="https://use.typekit.net/tzc4mfh.css">
</head>

<body>
  <div class="overlay"></div>
  <div class="container-fluid vh-100 d-flex align-items-center">
    <div class="row w-100">

      <!-- Columna izquierda  -->
      <div class="col-md-6 d-flex align-items-center justify-content-center order-2 order-md-1">
        <div class="quote-box">
          <p class="quote-text">“Buenos cristianos y honrados ciudadanos”</p>
          <p class="quote-author">– Don Bosco</p>
        </div>
      </div>

      <!-- Columna derecha -->
      <div class="col-md-6 d-flex align-items-center justify-content-center order-1 order-md-2">
        <div class="card-custom text-center w-100 mx-3">
          <!-- Logo arriba -->
          <img src="assets/colegio/logo2.png" alt="Logo Colegio Don Bosco" class="logo-card mb-4">
          <h1 class="mb-4">Sistema de Gestión de Mantenimiento</h1>
          <h2 class="mb-4">Iniciar Sesión</h2>
          <form>
            <div class="mb-3">
              <input type="email" class="form-control-custom" placeholder="Correo electrónico">
            </div>
            <div class="mb-3">
              <input type="password" class="form-control-custom" placeholder="Contraseña">
            </div>
            <div class="form-check mb-3 d-flex align-items-center">
              <input class="form-check-input" type="checkbox" id="rememberMe">
              <label class="form-check-label" for="rememberMe">Recordarme</label>
            </div>
            <button type="submit" class="btn-primary-custom">Ingresar</button>
            <div class="mt-4 text-center">
              <a href="#" class="link-custom">¿Olvidaste tu contraseña?</a>
            </div>
          </form>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nuevo Requerimiento</title>
  <link rel="icon" type="image/png" href="assets/colegio/logo2.png">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="styles/requerimientos.css" />
  <link rel="stylesheet" href="styles/panelIzquierdo.css" />
  
  <link rel="stylesheet" href="https://use.typekit.net/tzc4mfh.css">

</head>

<body>

  <!-- Barra Lateral -->
  <div class="sidebar" id="sidebar">
    <img src="assets/colegio/logo2.png" alt="Logo Colegio Don Bosco" class="logo mb-2">

    <button class="hamburger btn btn-link text-white p-0" onclick="toggleSidebar()" aria-label="Toggle menu">
      <i class="bi bi-list fs-2"></i>
    </button>

    <ul class="nav flex-column">
      <li class="nav-item">
        <a class="nav-link text-white active" href="panel.html">
          <i class="bi bi-speedometer2 me-2"></i>Panel Principal
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-white" href="requerimientos.html">
          <i class="bi bi-pencil-square me-2"></i>Nuevo Requerimiento
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-white" href="gestionTareas.html">
          <i class="bi bi-bar-chart me-2"></i>Gestion de Tareas
          <span class="badge bg-danger rounded-pill ms-1"></span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-white" href="listaRequerimientos.html">
          <i class="bi bi-clock-history me-2"></i>Historial
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-white" href="panelJefe.html">
          <i class="bi bi-people me-2"></i> Panel Jefe
        </a>
      </li>
    </ul>

    <div class="user-profile text-center">
      <div class="avatar mx-auto"></div>
      <span class="d-block">Usuario</span>
      <small class="d-block text-white-50">Rol</small>
    </div>
  </div>

  <!-- Para celu -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

  <!-- Main-->
  <div class="main-content">
    <div class="container-fluid px-3 px-md-4">
      <h1 class="h2 mt-3 mb-4 pb-2 border-bottom border-danger">
        <i class="bi bi-pencil-square me-2 text-danger"></i>Nuevo Requerimiento
      </h1>

      <form id="requerimientoForm" class="bg-white p-3 p-md-4 p-lg-5 rounded-3 shadow-sm">
        
        <div class="mb-3">
          <label for="titulo" class="form-label fw-semibold">
            Título <span class="text-danger">*</span>
          </label>
          <input type="text" class="form-control" id="titulo" placeholder="Ingrese un título breve" required>
        </div>

        
        <div class="mb-3">
          <label for="descripcion" class="form-label fw-semibold">
            Descripción <span class="text-danger">*</span>
          </label>
          <textarea class="form-control" id="descripcion" rows="4"
            placeholder="Describa en detalle el problema detectado..." required></textarea>
        </div>

        
        <div class="mb-3">
          <label for="lugar" class="form-label fw-semibold">Lugar</label>
          <select class="form-select" id="lugar">
            <option value="">Seleccione el lugar</option>
            <option value="aula1">Aula 1</option>
            <option value="aula2">Aula 2</option>
            <option value="aula3">Aula 3</option>
            <option value="patio">Patio</option>
            <option value="pabellon">Pabellón</option>
            <option value="direccion">Dirección</option>
            <option value="otro">Otro</option>
          </select>
        </div>
        
        <div class="row g-4 mb-4">
          <div class="col-12 col-md-6">
            <label for="fecha" class="form-label fw-bold" style="color: #2d2d2d;">
              Fecha de emisión
            </label>
            <input type="date" class="form-control form-control-lg" id="fecha"
              style="border-radius: 8px; border-color: #e0e0e0;">
          </div>
          <div class="col-12 col-md-6">
            <label for="prioridad" class="form-label fw-bold" style="color: #2d2d2d;">
              Prioridad
            </label>
            <select class="form-select form-select-lg" id="prioridad"
              style="border-radius: 8px; border-color: #e0e0e0;">
              <option value="urgente" style="color: #dc3545;">
                🔴 Urgente - Requiere atención inmediata
              </option>
              <option value="alta" style="color: #fd7e14;">
                🟠 Alta - Alta prioridad
              </option>
              <option value="media" selected style="color: #0d6efd;">
                🟡 Media - Prioridad media
              </option>
              <option value="baja" style="color: #198754;">
                🟢 Baja - Baja prioridad
              </option>
            </select>
          </div>
        </div>

        <!--IMAGEN-->
        <div class="mb-4">
          <label for="imagen" class="form-label fw-bold" style="color: #2d2d2d;">
            <i class="bi bi-image me-1"></i>Adjuntar imagen
            <span class="text-muted fw-normal">(opcional)</span>
          </label>

          <div class="upload-area border-2 border-dashed rounded-3 p-4 text-center" id="uploadArea"
            style="border-color: #dee2e6; cursor: pointer; transition: all 0.3s ease; background-color: #f8f9fa;">

            <input type="file" class="d-none" id="imagen" accept="image/*">

            <i class="bi bi-cloud-upload fs-1 text-secondary"></i>
            <p class="mb-1 mt-2">Arrastre una imagen aquí o haga clic para seleccionar</p>
            <small class="text-muted">Formatos: JPG, PNG, GIF, WebP (Máx. 5MB)</small>

            <!-- Vista previa -->
            <div id="previewContainer" class="d-none mt-3">
              <img id="imagePreview" class="img-fluid rounded-3" style="max-height: 200px;" alt="Vista previa">
              <button type="button" class="btn btn-sm btn-outline-danger mt-2" onclick="eliminarImagen()">
                <i class="bi bi-trash me-1"></i>Eliminar imagen
              </button>
            </div>
          </div>

          <div id="fileInfo" class="mt-2 text-muted small"></div>
        </div>
        <!-- Botones -->
        <div class="d-flex flex-column flex-md-row gap-2 justify-content-end mt-4 pt-3 border-top">
          <button type="button" class="btn btn-outline-secondary order-2 order-md-1" onclick="cancelarFormulario()">
            <i class="bi bi-x-circle me-1"></i>Cancelar
          </button>
          <button type="submit" class="btn btn-danger order-1 order-md-2">
            <i class="bi bi-check-circle me-1"></i>Guardar
          </button>
        </div>
      </form>
      <!-- Footer -->
      <div class="mt-4 pt-3 border-top text-muted d-flex justify-content-between align-items-center">
        <div>
          <span class="fw-bold">Usuario</span>
          <span class="mx-2">•</span>
          <span>Rol</span>
        </div>
        <small>© 2026 Colegio Don Bosco</small>
      </div>
    </div>
  </div>

  <script>
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');

      sidebar.classList.toggle('active');

      if (sidebar.classList.contains('active')) {
        overlay.style.display = 'block';
        document.body.style.overflow = 'hidden';
      } else {
        overlay.style.display = 'none';
        document.body.style.overflow = '';
      }
    }

    function closeSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');

      sidebar.classList.remove('active');
      overlay.style.display = 'none';
      document.body.style.overflow = '';
    }

    // Cerrar sidebar al hacer click fuera
    document.addEventListener('click', function (event) {
      const sidebar = document.getElementById('sidebar');
      const hamburger = document.querySelector('.hamburger');

      if (window.innerWidth <= 768 &&
        sidebar.classList.contains('active') &&
        !sidebar.contains(event.target) &&
        !hamburger.contains(event.target)) {
        closeSidebar();
      }
    });

    window.addEventListener('resize', function () {
      if (window.innerWidth > 768) {
        closeSidebar();
      }
    });
  </script>
</body>

</html>

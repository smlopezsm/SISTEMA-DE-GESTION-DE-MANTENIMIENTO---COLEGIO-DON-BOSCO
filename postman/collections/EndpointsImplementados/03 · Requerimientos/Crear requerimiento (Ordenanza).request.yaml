$kind: http-request
url: "{{baseUrl}}/requerimientos"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "idCategoria": 1,
      "descripcion": "Prueba de requerimiento desde Postman.",
      "sector": "Aula 12"
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenOrdenanza}}"
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      if (res.id) { pm.collectionVariables.set('requerimientoCreadoId', res.id); }
      pm.test('Status 201', () => pm.response.to.have.status(201));
    language: text/javascript
order: 2000

$kind: http-request
url: "{{baseUrl}}/requerimientos"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "idCategoria": 1
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenOrdenanza}}"
scripts:
  - type: afterResponse
    code: pm.test('Status 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 3000

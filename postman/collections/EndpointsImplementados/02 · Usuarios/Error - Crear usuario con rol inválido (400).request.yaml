$kind: http-request
url: "{{baseUrl}}/usuarios"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nombre": "Usuario",
      "apellido": "Malo",
      "email": "malo@donbosco.org.ar",
      "rol": "rey"
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenDirectivo}}"
scripts:
  - type: afterResponse
    code: pm.test('Status 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 6000

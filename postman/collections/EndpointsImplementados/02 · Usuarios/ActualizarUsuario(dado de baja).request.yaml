$kind: http-request
url: "{{baseUrl}}/usuarios/{{idUsuario}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "activo": true
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenDirectivo}}"
scripts:
  - type: afterResponse
    code: pm.test('Status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 9000

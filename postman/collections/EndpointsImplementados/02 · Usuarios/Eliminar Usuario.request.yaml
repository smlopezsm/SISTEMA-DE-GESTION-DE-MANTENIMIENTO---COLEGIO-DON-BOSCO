$kind: http-request
url: "{{baseUrl}}/usuarios/{{idUsuario}}"
method: DELETE
headers:
  Content-Type: application/json
auth:
  type: bearer
  credentials:
    token: "{{tokenDirectivo}}"
scripts:
  - type: afterResponse
    code: pm.test("Status code is 204", () => pm.response.to.have.status(204));
    language: text/javascript
order: 10000

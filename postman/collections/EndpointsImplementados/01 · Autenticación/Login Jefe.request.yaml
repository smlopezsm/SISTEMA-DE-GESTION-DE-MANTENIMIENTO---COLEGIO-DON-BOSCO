$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nombreUsuario": "jrodriguez",
      "password": "1234"
    }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      if (res.token) { pm.collectionVariables.set('tokenJefe', res.token); pm.collectionVariables.set('token', res.token); }
      pm.test('Status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 2000

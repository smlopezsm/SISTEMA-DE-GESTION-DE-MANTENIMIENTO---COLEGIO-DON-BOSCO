$kind: http-request
name: Perfil con token (Ordenanza)
url: "{{baseUrl}}/auth/perfil"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{tokenOrdenanza}}"
scripts:
  - type: afterResponse
    code: pm.test('Status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 7671

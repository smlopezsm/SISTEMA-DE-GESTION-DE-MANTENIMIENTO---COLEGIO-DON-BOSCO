$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nombreUsuario": "jrodriguez",
      "password": "incorrecta"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 4000

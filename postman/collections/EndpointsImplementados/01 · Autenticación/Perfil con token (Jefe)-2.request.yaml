$kind: http-request
name: Perfil con token (Jefe)
url: "{{baseUrl}}/auth/perfil"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{tokenJefe}}"
scripts:
  - type: afterResponse
    code: pm.test('Status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 6000

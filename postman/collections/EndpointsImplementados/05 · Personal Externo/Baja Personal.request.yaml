$kind: http-request
url: "{{baseUrl}}/personal-externos/{{idPersonal}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{tokenJefe}}"
scripts:
  - type: afterResponse
    code: pm.test("Status code is 204", () => pm.response.to.have.status(204));
    language: text/javascript
order: 5000

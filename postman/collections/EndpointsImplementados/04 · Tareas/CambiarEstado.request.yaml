$kind: http-request
url: "{{baseUrl}}/tareas/{{idTarea}}/estado"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: '{ "estado": "cancelada" }'
auth:
  type: bearer
  credentials:
    token: "{{tokenJefe}}"
scripts:
  - type: afterResponse
    code: pm.test("Status code is 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 7000

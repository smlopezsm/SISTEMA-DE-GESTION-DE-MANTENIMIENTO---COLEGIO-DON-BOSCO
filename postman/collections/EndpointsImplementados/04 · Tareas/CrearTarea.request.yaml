$kind: http-request
url: "{{baseUrl}}/tareas"
method: POST
body:
  type: json
  content: "{\r

    \  \"idRequerimiento\": {{idRequerimiento}},\r

    \  \"prioridad\": \"alta\",\r

    \  \"idResponsable\": 8\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{tokenJefe}}"
scripts:
  - type: afterResponse
    code: pm.test("Status code is 201", () => pm.response.to.have.status(201));
    language: text/javascript
order: 12000

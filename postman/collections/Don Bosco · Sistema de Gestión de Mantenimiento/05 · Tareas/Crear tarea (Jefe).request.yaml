$kind: http-request
url: "{{baseUrl}}/tareas"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "idRequerimiento": {{requerimientoParaTareaId}},
      "prioridad": "media",
      "observaciones": "Tarea creada desde Postman.",
      "idResponsable": 6
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenJefe}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('tareaCreadaId', pm.response.json().id);
    language: text/javascript
order: 3000

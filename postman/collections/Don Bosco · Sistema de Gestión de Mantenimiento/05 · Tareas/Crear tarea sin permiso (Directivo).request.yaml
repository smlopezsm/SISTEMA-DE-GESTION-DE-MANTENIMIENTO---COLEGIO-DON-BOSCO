$kind: http-request
url: "{{baseUrl}}/tareas"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "idRequerimiento": {{requerimientoParaTareaId}},
      "prioridad": "media"
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenDirectivo}}"
scripts:
  - type: afterResponse
    code: pm.test('Status 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 5000

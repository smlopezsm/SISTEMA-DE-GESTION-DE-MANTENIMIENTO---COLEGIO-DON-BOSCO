$kind: http-request
url: "{{baseUrl}}/tareas"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "idRequerimiento": {{requerimientoParaTareaId}},
      "prioridad": "urgentisima"
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenJefe}}"
scripts:
  - type: afterResponse
    code: pm.test('Status 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 4000

$kind: http-request
url: "{{baseUrl}}/tareas/{{tareaCreadaId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "prioridad": "alta",
      "observaciones": "Prioridad subida desde Postman."
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenJefe}}"
scripts:
  - type: afterResponse
    code: pm.test('Status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 10000

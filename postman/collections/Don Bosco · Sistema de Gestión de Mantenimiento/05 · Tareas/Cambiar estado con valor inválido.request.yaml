$kind: http-request
url: "{{baseUrl}}/tareas/{{tareaCreadaId}}/estado"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "estado": "inexistente"
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenJefe}}"
scripts:
  - type: afterResponse
    code: pm.test('Status 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 12000

$kind: http-request
url: "{{baseUrl}}/tareas"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{tokenJefe}}"
scripts:
  - type: afterResponse
    code: |-
      const respuestaApi = pm.response.json();
      if (respuestaApi[0]?.id) pm.collectionVariables.set('tareaId', respuestaApi[0]?.id);
      pm.test('Status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 1000

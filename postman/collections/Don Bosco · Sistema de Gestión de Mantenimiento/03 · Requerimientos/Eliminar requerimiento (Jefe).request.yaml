$kind: http-request
url: "{{baseUrl}}/requerimientos/{{requerimientoBorrarId}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{tokenJefe}}"
scripts:
  - type: afterResponse
    code: pm.test('Status 204', () => pm.response.to.have.status(204));
    language: text/javascript
order: 10000

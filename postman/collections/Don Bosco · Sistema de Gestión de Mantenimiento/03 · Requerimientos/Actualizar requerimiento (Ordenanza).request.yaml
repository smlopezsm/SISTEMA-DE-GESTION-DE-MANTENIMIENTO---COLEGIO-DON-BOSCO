$kind: http-request
url: "{{baseUrl}}/requerimientos/{{requerimientoCreadoId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "descripcion": "Descripción editada desde Postman."
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenOrdenanza}}"
scripts:
  - type: afterResponse
    code: pm.test('Status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 7000

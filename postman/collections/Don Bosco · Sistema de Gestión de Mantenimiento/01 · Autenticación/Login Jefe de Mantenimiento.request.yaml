$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nombreUsuario": "jrodriguez",
      "password": "1234"
    }
scripts:
  - type: afterResponse
    code: |-
      const data = pm.response.json();
      if (data.token) { pm.collectionVariables.set('tokenJefe', data.token); pm.collectionVariables.set('token', data.token); }
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Devuelve token JWT', () => pm.expect(pm.response.json().token).to.be.a('string').and.not.empty);
      pm.test('No devuelve contraseña ni hash', () => {
        const txt = JSON.stringify(pm.response.json()).toLowerCase();
        pm.expect(txt).to.not.include('password');
        pm.expect(txt).to.not.include('contraseña');
        pm.expect(txt).to.not.include('hash');
      });
    language: text/javascript
order: 4000

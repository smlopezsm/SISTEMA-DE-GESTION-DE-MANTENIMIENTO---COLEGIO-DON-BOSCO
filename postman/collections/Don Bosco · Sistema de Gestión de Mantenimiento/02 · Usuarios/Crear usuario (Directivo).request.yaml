$kind: http-request
url: "{{baseUrl}}/usuarios"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nombre": "Usuario",
      "apellido": "De Prueba",
      "nombreUsuario": "prueba{{$randomInt}}",
      "email": "prueba{{$randomInt}}@donbosco.org.ar",
      "rol": "ordenanza",
      "telefono": "266 4559999"
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenDirectivo}}"
scripts:
  - type: afterResponse
    code: |-
      const respuestaApi = pm.response.json();
      if (respuestaApi.id) pm.collectionVariables.set('usuarioCreadoId', respuestaApi.id);
      pm.test('Status 201', () => pm.response.to.have.status(201));
      pm.test('No devuelve contraseña ni hash', () => {
        const txt = JSON.stringify(pm.response.json()).toLowerCase();
        pm.expect(txt).to.not.include('password');
        pm.expect(txt).to.not.include('contraseña');
        pm.expect(txt).to.not.include('hash');
      });
    language: text/javascript
order: 5000

$kind: http-request
url: "{{baseUrl}}/usuarios/99999"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nombre": "Nadie"
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenDirectivo}}"
scripts:
  - type: afterResponse
    code: pm.test('Status 404', () => pm.response.to.have.status(404));
    language: text/javascript
order: 7000

$kind: http-request
url: "{{baseUrl}}/personal-externos/{{personalCreadoId}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{tokenJefe}}"
scripts:
  - type: afterResponse
    code: pm.test('Status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 3000

$kind: http-request
url: "{{baseUrl}}/personal-externos"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nombre": "Personal",
      "apellido": "De Prueba",
      "telefono": "266 4000000",
      "especialidad": "Electricista",
      "dni": "{{dniAleatorio}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenJefe}}"
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('dniAleatorio', String(Math.floor(10000000 + Math.random() * 89999999)));
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status 201', () => pm.response.to.have.status(201));
      pm.collectionVariables.set('personalCreadoId', pm.response.json().id);
    language: text/javascript
order: 2000

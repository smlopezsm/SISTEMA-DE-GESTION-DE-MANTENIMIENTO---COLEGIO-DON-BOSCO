$kind: http-request
url: "{{baseUrl}}/personal-externos/{{personalCreadoId}}"
method: DELETE
auth:
  type: bearer
  credentials:
    token: "{{tokenDirectivo}}"
scripts:
  - type: afterResponse
    code: pm.test('Status 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 10000

$kind: http-request
url: "{{baseUrl}}/tareas/{{tareaCreadaId}}/historial"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{tokenOrdenanza}}"
scripts:
  - type: afterResponse
    code: pm.test('Status 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 3000

$kind: http-request
url: "{{baseUrl}}/tareas/{{tareaCreadaId}}/compras"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "monto": 100,
      "detalle": "Compra de prueba"
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenDirectivo}}"
scripts:
  - type: afterResponse
    code: pm.test('Status 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 3000

$kind: http-request
url: "{{baseUrl}}/tareas/{{tareaCreadaId}}/compras"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "monto": -5,
      "detalle": "Compra inválida"
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenJefe}}"
scripts:
  - type: afterResponse
    code: pm.test('Status 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 2000

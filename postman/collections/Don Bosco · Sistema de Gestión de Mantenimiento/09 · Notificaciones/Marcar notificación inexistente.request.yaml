$kind: http-request
url: "{{baseUrl}}/notificaciones/99999"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "leida": true
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenJefe}}"
scripts:
  - type: afterResponse
    code: pm.test('Status 404', () => pm.response.to.have.status(404));
    language: text/javascript
order: 3000

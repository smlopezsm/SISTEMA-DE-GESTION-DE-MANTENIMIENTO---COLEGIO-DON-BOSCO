$kind: http-request
url: "{{baseUrl}}/notificaciones/{{notificacionId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "leida": true
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenJefe}}"
scripts:
  - type: afterResponse
    code: pm.test('Status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 2000
